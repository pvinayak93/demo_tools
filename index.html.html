le=\"font-weight:700\">Scenario A: priority score factors<\u002Fdiv>\n      <sc-for list=\"{{ wB }}\" as=\"w\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:minmax(0,150px) 1fr 70px;gap:8px;align-items:center;font-size:13px\"><div>{{ w.n }}<\u002Fdiv><input type=\"range\" min=\"0\" max=\"100\" value=\"{{ w.val }}\" sc-camel-on-change=\"{{ w.onChange }}\"><div style=\"font-weight:700\">{{ w.cur }} to {{ w.val }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"font-weight:700;margin-top:10px\">Goal area weights (current to scenario)<\u002Fdiv>\n      <sc-for list=\"{{ wG }}\" as=\"w\" hint-placeholder-count=\"9\"><div style=\"display:grid;grid-template-columns:minmax(0,190px) 1fr 80px;gap:8px;align-items:center;font-size:13px\"><div>{{ w.n }}<\u002Fdiv><input type=\"range\" min=\"0\" max=\"50\" value=\"{{ w.val }}\" sc-camel-on-change=\"{{ w.onChange }}\"><div><b>{{ w.cur }} to {{ w.val }}<\u002Fb> <span style=\"color:#8E5393\">{{ w.d }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"font-size:12px;color:#666\">{{ wTot }}<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:6px\">\n        <sc-if value=\"{{ wOk }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ wSave }}\" style=\"background:#0D5C80;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Save scenario<\u002Fbutton><button sc-camel-on-click=\"{{ wApprove }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Submit for approval<\u002Fbutton><\u002Fsc-if>\n        <sc-if value=\"{{ wBad }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:#8E3F12;font-weight:600;padding:8px 0\">Fix totals to save<\u002Fspan><\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ wCmp }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Compare scenarios<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ wReset }}\" style=\"background:none;color:#0D5C80;border:0;padding:8px 4px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline\">Reset<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ wPending }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;background:#E1EEF3;border-radius:10px;padding:8px 10px\">Pending approval by the Steering Committee. Published scores keep using the approved version.<\u002Fdiv><\u002Fsc-if>\n      <sc-if value=\"{{ wShowCmp }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border-top:1px solid #F0F3F6;padding-top:8px;font-size:13px\"><div style=\"font-weight:700\">Saved scenarios<\u002Fdiv><sc-if value=\"{{ wNoSaved }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"color:#666\">None saved yet.<\u002Fdiv><\u002Fsc-if><sc-for list=\"{{ wSaved }}\" as=\"x\" hint-placeholder-count=\"0\"><div style=\"padding:4px 0\">{{ x.n }}: top three {{ x.top }} ({{ x.eq }})<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-weight:700\">Effect on the ranking<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 80px 80px 70px;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666;font-weight:600\"><div>Project<\u002Fdiv><div>Now<\u002Fdiv><div>Scenario<\u002Fdiv><div>Change<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ wRows }}\" as=\"r\" hint-placeholder-count=\"10\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) 80px 80px 70px;gap:8px;font-size:13px;border-top:1px solid #F0F3F6;padding-top:6px\"><div>{{ r.n }}<\u002Fdiv><div>{{ r.now }}<\u002Fdiv><div style=\"font-weight:700\">{{ r.sc }}<\u002Fdiv><div style=\"font-weight:600;color:{{ r.col }}\">{{ r.ch }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"font-size:13px;margin-top:6px\"><b>Reading the result:<\u002Fb> {{ wRead }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_validate }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:1100px\">\n  <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Learning from Results: Before and After Validation<\u002Fdiv>\n  <div style=\"background:#E1EEF3;border-radius:12px;padding:12px 16px;font-size:13px\">Models are built and validated outside the Toolkit. This report shows how each one performed against completed projects. A recalibration request is logged for the modeling team and does not change any model here.<\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:8px\">\n    <div style=\"font-weight:700\">Predicted vs observed change (completed projects, illustrative)<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 54px 130px 120px;gap:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666;font-weight:600\"><div>Project type / category<\u002Fdiv><div>Predicted (dark), observed (light)<\u002Fdiv><div>Error<\u002Fdiv><div>Model status<\u002Fdiv><div>Request<\u002Fdiv><\u002Fdiv>\n    <sc-for list=\"{{ vRows }}\" as=\"r\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 54px 130px 120px;gap:10px;align-items:center;font-size:13px;border-top:1px solid #F0F3F6;padding:8px 4px;cursor:pointer;background:{{ r.bg }}\"><div><b>{{ r.t }}<\u002Fb><div style=\"font-size:12px;color:#666\">{{ r.type }}<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px\"><div style=\"height:7px;border-radius:3px;background:#0D5C80;width:{{ r.pwn }}\"><\u002Fdiv><div style=\"height:7px;border-radius:3px;background:#5BA4C4;width:{{ r.ow }}\"><\u002Fdiv><\u002Fdiv><div style=\"font-weight:700\">{{ r.err }}<\u002Fdiv><div style=\"font-size:12px\">{{ r.st }}<\u002Fdiv>\n    <div><sc-if value=\"{{ r.canReq }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ r.onReq }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:5px 8px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Request recalibration<\u002Fbutton><\u002Fsc-if><sc-if value=\"{{ r.rq }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:#0D5C80;font-weight:600\">Requested<\u002Fspan><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n    <div style=\"font-size:13px\">Average error across six project types: <b>{{ vAvg }}%<\u002Fb>. Crash outcomes need several years of data. Scores change only when a new model version is registered.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start\">\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-weight:700\">Projects behind: {{ vSelName }}<\u002Fdiv><sc-for list=\"{{ vProjs }}\" as=\"p\" hint-placeholder-count=\"2\"><div style=\"font-size:13px;border-top:1px solid #F0F3F6;padding-top:6px\">{{ p.n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-weight:700\">Requests to the modeling team<\u002Fdiv>\n      <sc-if value=\"{{ vNoReq }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:13px;color:#666\">None logged yet.<\u002Fdiv><\u002Fsc-if>\n      <sc-for list=\"{{ vReqList }}\" as=\"p\" hint-placeholder-count=\"0\"><div style=\"font-size:13px;border-top:1px solid #F0F3F6;padding-top:6px\">{{ p.n }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_models }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:1150px\">\n  <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Models: Built and Validated Outside the Toolkit<\u002Fdiv>\n  <div style=\"background:#E1EEF3;border-radius:12px;padding:12px 16px;font-size:13px\">Read-only. Models are designed, built and validated by RTC's modeling team, then registered here with a version. Each model is specific to a project type and a category, and it calculates benefits from the project description. Admins have access to this page but cannot edit models.<\u002Fdiv>\n  <div style=\"display:flex;gap:4px;border-bottom:1px solid #C9D3D9\"><sc-for list=\"{{ mTabs }}\" as=\"t\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"background:none;border:0;border-bottom:3px solid {{ t.bd }};padding:10px 14px 8px;font-family:inherit;font-size:14px;font-weight:{{ t.fw }};cursor:pointer;color:#0D5C80\">{{ t.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n  <sc-if value=\"{{ m_reg }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;overflow:auto\">\n    <div style=\"font-weight:700;margin-bottom:8px\">Project type x category<\u002Fdiv>\n    <div style=\"min-width:760px;display:grid;grid-template-columns:170px repeat(6,minmax(0,1fr));gap:6px;align-items:stretch\">\n      <div><\u002Fdiv><sc-for list=\"{{ mCols }}\" as=\"c\" hint-placeholder-count=\"6\"><div style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666;font-weight:600\">{{ c.n }}<\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-for list=\"{{ mMatrix }}\" as=\"r\" hint-placeholder-count=\"8\"><div style=\"min-width:760px;display:grid;grid-template-columns:170px repeat(6,minmax(0,1fr));gap:6px;align-items:stretch;margin-top:6px\"><div style=\"font-size:13px;font-weight:600;display:flex;align-items:center\">{{ r.type }}<\u002Fdiv>\n      <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ c.onClick }}\" style=\"border:2px solid {{ c.bd }};border-radius:10px;padding:6px 8px;font-size:12px;background:{{ c.bg }};color:{{ c.fg }};cursor:pointer;min-height:36px\"><sc-if value=\"{{ c.has }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-weight:700\">{{ c.id }}<\u002Fdiv><div>error {{ c.err }}<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ c.none }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"color:#999\">no model<\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-for>\n    <div style=\"font-size:12px;color:#666;margin-top:10px\">Blue: validated. Gray: in development. Orange: recalibration requested. A category with no model is not scored for that project type.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:6px\">\n    <div style=\"font-weight:700;font-size:16px\">{{ mDet.id }}: {{ mDet.title }}<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px\">\n      <div style=\"color:#666\">Status<\u002Fdiv><div style=\"font-weight:600\">{{ mDet.status }} ({{ mDet.ver }})<\u002Fdiv>\n      <div style=\"color:#666\">Reads<\u002Fdiv><div>Project type, length, features, modes, location, cost<\u002Fdiv>\n      <div style=\"color:#666\">Produces<\u002Fdiv><div>{{ mDet.out }}, by tract<\u002Fdiv>\n      <div style=\"color:#666\">Built and validated by<\u002Fdiv><div>RTC modeling team, outside the Toolkit<\u002Fdiv>\n      <div style=\"color:#666\">Validation<\u002Fdiv><div>{{ mDet.val }}. Error {{ mDet.err }}.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ m_run }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><div style=\"font-size:13px;font-weight:600\">Project<\u002Fdiv><sc-raw-select value=\"{{ mProj }}\" sc-camel-on-change=\"{{ onMProj }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:8px;font-family:inherit;font-size:13px;background:#fff;max-width:420px\"><sc-for list=\"{{ mProjOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.id }}\">{{ o.n }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start\">\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-weight:700\">Inputs: from the project description<\u002Fdiv>\n      <sc-for list=\"{{ mIn }}\" as=\"r\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:120px 1fr;gap:8px;border-top:1px solid #F0F3F6;padding-top:6px;font-size:13px\"><div style=\"color:#666\">{{ r.k }}<\u002Fdiv><div style=\"font-weight:600\">{{ r.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-weight:700\">Outputs: one model per category<\u002Fdiv>\n      <sc-for list=\"{{ mOut }}\" as=\"r\" hint-placeholder-count=\"5\"><div style=\"border-top:1px solid #F0F3F6;padding-top:6px;font-size:13px\"><div style=\"display:flex;gap:8px\"><b style=\"flex:1\">{{ r.cat }}<\u002Fb><span style=\"color:#666;font-size:12px\">{{ r.model }}<\u002Fspan><\u002Fdiv><div>{{ r.kpi }}: <b style=\"color:#0D5C80\">{{ r.val }}<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"font-size:12px;color:#666\">These outputs are standardized, scaled to goal scores, then weighted to produce the priority score.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ m_ver }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-weight:700\">Model versions<\u002Fdiv>\n    <sc-for list=\"{{ mVers }}\" as=\"r\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:90px 120px minmax(0,1fr) 160px;gap:10px;align-items:center;border-top:1px solid #F0F3F6;padding-top:8px;font-size:13px\"><b>{{ r.ver }}<\u002Fb><span style=\"background:{{ r.bg }};color:{{ r.fg }};border-radius:10px;padding:2px 8px;font-size:12px;font-weight:600;text-align:center\">{{ r.st }}<\u002Fspan><div>{{ r.use }}<\u002Fdiv><div style=\"color:#666\">{{ r.when }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n    <div style=\"font-size:12px;color:#666\">Weights are versioned separately (W2026.1, approved). A published score is always tied to one model version and one weights version.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_access }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:1100px\">\n  <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Access Control and Exports<\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;overflow:auto\">\n    <div style=\"font-weight:700;margin-bottom:8px\">Who can do what<\u002Fdiv>\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:13px\"><sc-raw-thead><sc-raw-tr style=\"text-align:left;color:#666;font-size:12px\"><sc-raw-th style=\"padding:6px 8px\">Capability<\u002Fsc-raw-th><sc-raw-th>Public<\u002Fsc-raw-th><sc-raw-th>Sponsor<\u002Fsc-raw-th><sc-raw-th>RTC Staff<\u002Fsc-raw-th><sc-raw-th>RTC Admin<\u002Fsc-raw-th><sc-raw-th>Committee<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">View published results<\u002Fsc-raw-td><sc-raw-td>Published<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Comment and register support<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Review public feedback on a project<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Read only<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Submit and edit own projects<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Own only<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Run new projects with LOCUS data<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Own only<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">See own scores before release<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Own only<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Review and quality-check submissions<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Program phasing and scenarios<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Change weights and model settings<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Publish results<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Manage users and access<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>-<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6\"><sc-raw-td style=\"padding:7px 8px\">Export data and reports<\u002Fsc-raw-td><sc-raw-td>Public data<\u002Fsc-raw-td><sc-raw-td>Own only<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n    <div style=\"font-size:12px;color:#666;margin-top:8px\">Committee members see draft results before public release. Every action is logged with user, time, and change.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px\">\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-weight:700\">Export formats<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;font-size:13px\"><b style=\"width:110px\">Excel and CSV<\u002Fb><span style=\"flex:1;color:#444\">Scores, KPI detail, project tables<\u002Fspan><button sc-camel-on-click=\"{{ acExport }}\" style=\"background:#0D5C80;color:#fff;border:0;border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Export<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;font-size:13px\"><b style=\"width:110px\">PDF<\u002Fb><span style=\"flex:1;color:#444\">Project scorecards and summary reports<\u002Fspan><button sc-camel-on-click=\"{{ acMock }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Export<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;font-size:13px\"><b style=\"width:110px\">GIS<\u002Fb><span style=\"flex:1;color:#444\">Shapefile and GeoJSON of projects and tracts<\u002Fspan><button sc-camel-on-click=\"{{ acMock }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Export<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;font-size:13px\"><b style=\"width:110px\">Scenario reports<\u002Fb><span style=\"flex:1;color:#444\">Baskets, weights, and sensitivity results<\u002Fspan><button sc-camel-on-click=\"{{ acMock }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Export<\u002Fbutton><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center;font-size:13px\"><b style=\"width:110px\">Audit log<\u002Fb><span style=\"flex:1;color:#444\">Who changed what, and when<\u002Fspan><button sc-camel-on-click=\"{{ acMock }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Export<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:8px;font-size:13px\"><div style=\"font-weight:700\">Security and accountability<\u002Fdiv><div>Single sign-on and multi-factor sign-in<\u002Fdiv><div>Role-based access to data and actions<\u002Fdiv><div>Immutable audit trail for scores and weights<\u002Fdiv><div>RTC owns the data and the platform<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_help }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:1100px\">\n  <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Help: How Scores Are Built<\u002Fdiv>\n  <div style=\"display:flex;gap:4px;border-bottom:1px solid #C9D3D9\"><sc-for list=\"{{ hTabs }}\" as=\"t\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ t.onClick }}\" style=\"background:none;border:0;border-bottom:3px solid {{ t.bd }};padding:10px 14px 8px;font-family:inherit;font-size:14px;font-weight:{{ t.fw }};cursor:pointer;color:#0D5C80\">{{ t.l }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n  <sc-if value=\"{{ hScore }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px\">\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:10px;font-size:12px\"><div style=\"font-size:20px;font-weight:700;color:#0D5C80\">1<\u002Fdiv><b>KPI change by tract<\u002Fb><div style=\"color:#555;margin-top:4px\">Before (no project) vs After (with project) for each indicator<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:10px;font-size:12px\"><div style=\"font-size:20px;font-weight:700;color:#0D5C80\">2<\u002Fdiv><b>Direction of benefit<\u002Fb><div style=\"color:#555;margin-top:4px\">Only improvements earn points; adverse impacts are reported separately<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:10px;font-size:12px\"><div style=\"font-size:20px;font-weight:700;color:#0D5C80\">3<\u002Fdiv><b>Standardize<\u002Fb><div style=\"color:#555;margin-top:4px\">Divide by regional variation so different units are comparable<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:10px;font-size:12px\"><div style=\"font-size:20px;font-weight:700;color:#0D5C80\">4<\u002Fdiv><b>Goal scores<\u002Fb><div style=\"color:#555;margin-top:4px\">Sum by goal area and scale to 0 to 100 with fixed benchmarks<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:10px;font-size:12px\"><div style=\"font-size:20px;font-weight:700;color:#0D5C80\">5<\u002Fdiv><b>Apply RTC weights<\u002Fb><div style=\"color:#555;margin-top:4px\">Goal weights set by RTC with the Steering Committee<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:10px;font-size:12px\"><div style=\"font-size:20px;font-weight:700;color:#0D5C80\">6<\u002Fdiv><b>Add cost and support<\u002Fb><div style=\"color:#555;margin-top:4px\">Cost-effectiveness and public support join the benefit score<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:10px;font-size:12px\"><div style=\"font-size:20px;font-weight:700;color:#0D5C80\">7<\u002Fdiv><b>Rank and explain<\u002Fb><div style=\"color:#555;margin-top:4px\">Rank percentile, plus a public reason for every decision<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start\">\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;font-size:13px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-weight:700\">Worked example: Jobs reachable by transit (one census tract)<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr auto;gap:6px 12px;border-top:1px solid #F0F3F6;padding-top:8px\"><div style=\"color:#666\">Before / After<\u002Fdiv><b>41,000 / 47,000 jobs<\u002Fb><div style=\"color:#666\">Improvement<\u002Fdiv><b>+6,000 jobs<\u002Fb><div style=\"color:#666\">Regional variation (std. dev.)<\u002Fdiv><b>12,000 jobs<\u002Fb><div style=\"color:#666\">Standardized change<\u002Fdiv><b>6,000 / 12,000 = 0.5 points<\u002Fb><\u002Fdiv>\n      <div style=\"color:#555\">Repeated for every tract and KPI, then summed.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;font-size:13px;display:flex;flex-direction:column;gap:8px\"><div style=\"font-weight:700\">Design principles<\u002Fdiv>\n      <div><b>Stable:<\u002Fb> a project's score does not change when other projects are added, only when RTC updates the model version.<\u002Fdiv>\n      <div><b>Fair to combinations:<\u002Fb> a basket of projects is rescored on its combined footprint, so overlap is counted once.<\u002Fdiv>\n      <div><b>Balanced:<\u002Fb> cost-effectiveness, public support, and geographic balance are shown next to the score.<\u002Fdiv>\n      <div><b>Transparent:<\u002Fb> every point traces to an indicator, a tract, and a data source.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hModels }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;font-size:13px;display:flex;flex-direction:column;gap:8px;max-width:760px\">\n    <div style=\"font-weight:700\">How models fit in<\u002Fdiv>\n    <div>Models are built and validated by RTC's modeling team outside the Toolkit, one per project type and category (safety, congestion, transit, active transportation, environment, equity and access).<\u002Fdiv>\n    <div>They read your project description: type, length, features, modes and location. You do not need to calculate benefits.<\u002Fdiv>\n    <div>If you provide your own estimates and a rationale, RTC compares them with the model. Within 25%, RTC decides which to adopt. If they differ more, RTC will contact you before finalizing.<\u002Fdiv>\n    <div>Every published score names the model version it used.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ hData }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;overflow:auto\">\n    <sc-raw-table style=\"border-collapse:collapse;width:100%;font-size:13px\"><sc-raw-thead><sc-raw-tr style=\"text-align:left;color:#666;font-size:12px\"><sc-raw-th style=\"padding:6px 8px\">Goal area<\u002Fsc-raw-th><sc-raw-th>Decision question<\u002Fsc-raw-th><sc-raw-th>Agency data first<\u002Fsc-raw-th><sc-raw-th style=\"color:#8E5393\">LOCUS adds<\u002Fsc-raw-th><sc-raw-th>Resulting measure<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Safety<\u002Fsc-raw-td><sc-raw-td>Where is risk highest?<\u002Fsc-raw-td><sc-raw-td>NDOT crashes, crash modification factors<\u002Fsc-raw-td><sc-raw-td>Exposure: volumes, speeds, walking and biking counts<\u002Fsc-raw-td><sc-raw-td>Expected crashes avoided<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Congestion and reliability<\u002Fsc-raw-td><sc-raw-td>Which projects cut delay?<\u002Fsc-raw-td><sc-raw-td>RTC and NDOT speeds, INRIX via NDOT<\u002Fsc-raw-td><sc-raw-td>15-minute speeds on all streets; fast routing for diversion<\u002Fsc-raw-td><sc-raw-td>Hours of delay saved, reliability<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Transit<\u002Fsc-raw-td><sc-raw-td>Who is served?<\u002Fsc-raw-td><sc-raw-td>RTC ridership and stop data<\u002Fsc-raw-td><sc-raw-td>Trips by mode and origin-destination to stops<\u002Fsc-raw-td><sc-raw-td>Riders served, jobs by transit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Active transportation<\u002Fsc-raw-td><sc-raw-td>Who would walk or bike?<\u002Fsc-raw-td><sc-raw-td>AT master plan, counts<\u002Fsc-raw-td><sc-raw-td>Short-trip origin-destination, walk and bike volumes<\u002Fsc-raw-td><sc-raw-td>Trips shifted, connectivity<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Environment<\u002Fsc-raw-td><sc-raw-td>What changes in emissions?<\u002Fsc-raw-td><sc-raw-td>RTC emission factors<\u002Fsc-raw-td><sc-raw-td>Vehicle miles and hours by link<\u002Fsc-raw-td><sc-raw-td>Emissions and GHG change<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Equity and access<\u002Fsc-raw-td><sc-raw-td>Who benefits?<\u002Fsc-raw-td><sc-raw-td>Census, equity priority areas<\u002Fsc-raw-td><sc-raw-td>Where users live and travel to<\u002Fsc-raw-td><sc-raw-td>Share of benefit to equity areas<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Health<\u002Fsc-raw-td><sc-raw-td>Who is exposed or reached?<\u002Fsc-raw-td><sc-raw-td>Public health and crash data<\u002Fsc-raw-td><sc-raw-td>Active travel and exposure by area<\u002Fsc-raw-td><sc-raw-td>Health exposure index<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Land use and housing<\u002Fsc-raw-td><sc-raw-td>What does it connect?<\u002Fsc-raw-td><sc-raw-td>Parcels, Southern Nevada Strong<\u002Fsc-raw-td><sc-raw-td>Trip attractions to housing and destinations<\u002Fsc-raw-td><sc-raw-td>Access to housing and services<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr style=\"border-top:1px solid #F0F3F6;vertical-align:top\"><sc-raw-td style=\"padding:7px 8px;font-weight:600\">Economic access<\u002Fsc-raw-td><sc-raw-td>Which jobs and businesses?<\u002Fsc-raw-td><sc-raw-td>Business and jobs data from agency<\u002Fsc-raw-td><sc-raw-td>Trips to business clusters<\u002Fsc-raw-td><sc-raw-td>Jobs and customers reached<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n    <div style=\"font-size:13px;margin-top:10px\">Agency data always comes first. LOCUS fills gaps, validates, and adds who uses a project and where they travel.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_explorer }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n  <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Public Project Explorer<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start\">\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:14px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font-weight:700\">Find projects<\u002Fdiv>\n      <sc-raw-select value=\"{{ eType }}\" sc-camel-on-change=\"{{ onEType }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ typeOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n      <sc-raw-select value=\"{{ eArea }}\" sc-camel-on-change=\"{{ onEArea }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ eAreaOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n      <sc-raw-select value=\"{{ eCost }}\" sc-camel-on-change=\"{{ onECost }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ costOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n      <div sc-camel-on-click=\"{{ onEEq }}\" style=\"display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer\"><div style=\"width:14px;height:14px;border:1.5px solid #0D5C80;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0D5C80;line-height:1\">{{ eEqMark }}<\u002Fdiv>Equity priority areas only<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ onEPlan }}\" style=\"display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer\"><div style=\"width:14px;height:14px;border:1.5px solid #0D5C80;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0D5C80;line-height:1\">{{ ePlanMark }}<\u002Fdiv>Selected for the draft plan<\u002Fdiv>\n      <div style=\"border-top:1px solid #F0F3F6;margin-top:4px\"><\u002Fdiv>\n      <sc-for list=\"{{ eList }}\" as=\"p\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ p.onClick }}\" style=\"padding:7px 6px;border-radius:10px;cursor:pointer;font-size:13px;background:{{ p.bg }}\"><div style=\"font-weight:600\">{{ p.name }}<\u002Fdiv><div style=\"font-size:12px;color:#666\">{{ p.id }} · score {{ p.score }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:14px;display:flex;flex-direction:column;gap:8px\">\n      <dc-import name=\"LocusMap\" lines=\"{{ eLines }}\" on-line=\"{{ lineClick }}\" hint-size=\"100%,340px\"><\u002Fdc-import>\n      <div style=\"font-size:12px;color:#666\">Dark blue lines are selected for the draft plan, gray are not. Numbers show rank.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-weight:700;font-size:16px\">{{ ep.id }} {{ ep.name }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:10px\"><div style=\"font-size:42px;font-weight:700;color:#0D5C80;line-height:1\">{{ ep.score }}<\u002Fdiv><div style=\"font-size:12px;color:#666\">Priority score, ranks above {{ epAbove }}% of projects<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-weight:600;font-size:13px\">Why this project's decision<\u002Fdiv>\n      <div style=\"font-size:13px;color:#333\">{{ epWhy }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#666\">When a decision differs from the ranking, RTC publishes the reason, covering public comments, public support, geographic balance, and projects in economically distressed areas.<\u002Fdiv>\n      <div style=\"border-top:1px solid #F0F3F6;padding-top:10px;font-weight:700\">Your view<\u002Fdiv>\n      <div style=\"display:flex;gap:6px\"><sc-for list=\"{{ eVotes }}\" as=\"b\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ b.onClick }}\" style=\"flex:1;border:1px solid #0D5C80;border-radius:10px;padding:8px 4px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }}\">{{ b.k }} ({{ b.n }})<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n      <textarea value=\"{{ cText }}\" sc-camel-on-change=\"{{ onCText }}\" rows=\"3\" placeholder=\"Add a comment...\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical\"><\u002Ftextarea>\n      <div style=\"display:flex;gap:10px;align-items:center\"><button sc-camel-on-click=\"{{ onPost }}\" style=\"background:#0D5C80;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Post comment<\u002Fbutton><div style=\"font-size:12px;color:#666;flex:1\">Comments and votes go to RTC and appear on this project's page for staff review.<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ eComments }}\" as=\"c\" hint-placeholder-count=\"0\"><div style=\"background:#F4F7F9;border-radius:10px;padding:8px 10px;font-size:13px\"><div>{{ c.t }}<\u002Fdiv><div style=\"font-size:12px;color:#666;margin-top:3px\">You · {{ c.v }} · {{ c.status }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"font-size:12px;color:#444;border-top:1px solid #F0F3F6;padding-top:8px\">{{ eThemes }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n    <\u002Fmain>\n    <aside style=\"width:{{ aW }};flex:none;background:#fff;border-left:1px solid #C9D3D9;display:flex;flex-direction:column;min-height:0\">\n      <div style=\"padding:14px 16px;border-bottom:1px solid #E9EFF1;display:flex;align-items:center;gap:8px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#8E5393\"><\u002Fdiv><div style=\"font-weight:700;flex:1\">Toolkit Assistant<\u002Fdiv><button sc-camel-on-click=\"{{ aToggle }}\" style=\"background:#fff;border:1px solid #DDE5EA;border-radius:10px;padding:3px 8px;font-family:inherit;font-size:12px;cursor:pointer\">{{ aTog }}<\u002Fbutton><\u002Fdiv>\n      <div ref=\"{{ msgRef }}\" style=\"display:{{ aBody }};flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ msgs }}\" as=\"m\" hint-placeholder-count=\"1\"><div style=\"align-self:{{ m.al }};max-width:92%;background:{{ m.bg }};color:{{ m.fg }};border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;white-space:pre-wrap\">{{ m.t }}<\u002Fdiv><\u002Fsc-for>\n        <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#666\">Thinking...<\u002Fdiv><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:{{ aBody }};padding:10px 14px;flex-wrap:wrap;gap:6px;border-top:1px solid #F0F3F6\">\n        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"2\"><button sc-camel-on-click=\"{{ c.onClick }}\" style=\"background:#fff;border:1px solid #0D5C80;color:#0D5C80;border-radius:14px;padding:5px 10px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:left\" style-hover=\"background:#EEF3F5\">{{ c.l }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:10px 14px 14px;display:{{ aBody }};gap:6px\">\n        <input value=\"{{ chat }}\" sc-camel-on-change=\"{{ onChat }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"Ask or filter in plain language...\" style=\"flex:1;min-width:0;border:1px solid #DDE5EA;border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px\">\n        <button sc-camel-on-click=\"{{ send }}\" style=\"background:#0D5C80;color:#fff;border:0;border-radius:10px;padding:0 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Ask<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border-top:1px solid #C9D3D9;padding:6px 20px;font-size:12px;color:#666;flex:none\">Illustrative concept with sample data. Not actual RTC projects or scores.<\u002Fdiv>\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25)\">{{ toast }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  G = ['Safety', 'Congestion and reliability', 'Transit', 'Active transportation', 'Environmental sustainability', 'Equity and access', 'Health', 'Land use and housing', 'Economic access'];\n  WC = [20, 15, 15, 10, 10, 15, 5, 5, 5];\n  ROLES = [['public', 'Public'], ['sponsor', 'Sponsor'], ['staff', 'RTC Staff'], ['admin', 'RTC Admin'], ['committee', 'Committee']];\n  NAV = {\n    public: [['explorer', 'Explore projects'], ['help', 'How scores work']],\n    sponsor: [['home', 'Home'], ['submit', 'Submit'], ['bulk', 'Bulk upload'], ['analysis', 'Run New Projects'], ['help', 'Help']],\n    staff: [['dashboard', 'Dashboard'], ['review', 'Review'], ['phasing', 'Program Phasing'], ['analysis', 'Run New Projects'], ['models', 'Models'], ['validate', 'Validation'], ['help', 'Help']],\n    admin: [['dashboard', 'Dashboard'], ['weights', 'Weights'], ['models', 'Models'], ['validate', 'Validation'], ['access', 'Access'], ['help', 'Help']],\n    committee: [['dashboard', 'Dashboard'], ['phasing', 'Program Phasing'], ['models', 'Models'], ['help', 'Help']]\n  };\n  TYPES = ['Transit', 'Safety', 'Operations', 'Roadway', 'Active transportation'];\n  SRC = { 'Federal TIP': 22, 'Local CIP': 10, 'State': 15 };\n  MT_TYPES = ['Transit priority lanes', 'Signal retiming', 'Complete streets retrofit', 'Bicycle facility', 'Pedestrian crossing', 'Roadway widening', 'Stop upgrades', 'Multiuse path'];\n  TCODE = ['TPL', 'SIG', 'CST', 'BIK', 'PED', 'WID', 'STP', 'MUP'];\n  CATS = ['Safety', 'Congestion', 'Transit', 'Active transportation', 'Environment', 'Equity and access'];\n  CCODE = ['SAF', 'CON', 'TRN', 'ACT', 'ENV', 'EQ'];\n  APPL = { 'Transit priority lane

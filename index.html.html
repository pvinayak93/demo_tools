document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\">Project map<\u002Fdiv>\n      <dc-import name=\"LocusMap\" lines=\"{{ dLines }}\" on-line=\"{{ lineClick }}\" hint-size=\"100%,320px\"><\u002Fdc-import>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#444\">\n        <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:18px;height:4px;background:#0D5C80\"><\u002Fdiv>High (80+)<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:18px;height:4px;background:#5BA4C4\"><\u002Fdiv>Medium<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:18px;height:4px;background:#B8C4CC\"><\u002Fdiv>Lower<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:14px;height:14px;background:rgba(142,83,147,.2)\"><\u002Fdiv>Equity priority area<\u002Fdiv>\n        <div style=\"color:#666\">Numbers show rank. Click a line to open its scorecard.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-weight:700\">Ranked projects ({{ dCount }})<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-raw-select value=\"{{ fType }}\" sc-camel-on-change=\"{{ onFType }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ typeOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n        <sc-raw-select value=\"{{ fSp }}\" sc-camel-on-change=\"{{ onFSp }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ spOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n        <sc-raw-select value=\"{{ fCost }}\" sc-camel-on-change=\"{{ onFCost }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ costOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:28px minmax(0,1fr) 110px 60px;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666;font-weight:600;padding:0 6px\"><div>#<\u002Fdiv><div>Project<\u002Fdiv><div>Score<\u002Fdiv><div style=\"text-align:right\">Cost<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ dRows }}\" as=\"r\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:grid;grid-template-columns:28px minmax(0,1fr) 110px 60px;gap:8px;align-items:center;padding:8px 6px;border-top:1px solid #F0F3F6;cursor:pointer\" style-hover=\"background:#F4F7F9\">\n        <div style=\"font-weight:700;color:#666\">{{ r.rank }}<\u002Fdiv>\n        <div style=\"min-width:0\"><div style=\"font-weight:600;font-size:13px\">{{ r.name }}<\u002Fdiv><div style=\"font-size:12px;color:#666\">{{ r.id }} · {{ r.sp }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"flex:1;height:8px;background:#EDF2F5;border-radius:10px\"><div style=\"height:8px;border-radius:10px;width:{{ r.w }};background:{{ r.color }}\"><\u002Fdiv><\u002Fdiv><div style=\"font-weight:700;width:24px;text-align:right\">{{ r.score }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"text-align:right;font-size:13px\">{{ r.cost }}<\u002Fdiv>\n      <\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_scorecard }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n    <button sc-camel-on-click=\"{{ scBack }}\" style=\"background:#fff;border:1px solid #CFE0E8;color:#0D5C80;border-radius:10px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Back<\u002Fbutton>\n    <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Project Scorecard: {{ sc.id }} {{ sc.name }}<\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <button sc-camel-on-click=\"{{ scLocus }}\" style=\"background:#fff;border:1px solid #CFE0E8;color:#0D5C80;border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Who uses this corridor (LOCUS)<\u002Fbutton>\n    <sc-if value=\"{{ scCanModel }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ scModel }}\" style=\"background:#fff;border:1px solid #CFE0E8;color:#0D5C80;border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">View model run<\u002Fbutton><\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ scExport }}\" style=\"background:#0D5C80;border:1px solid #0D5C80;color:#fff;border-radius:10px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Export scorecard<\u002Fbutton>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:20px;display:flex;gap:24px;align-items:center;flex-wrap:wrap\">\n        <div style=\"text-align:center\"><div style=\"font-size:64px;font-weight:700;color:#0D5C80;line-height:1\">{{ sc.score }}<\u002Fdiv><div style=\"font-size:12px;color:#666\">Priority Score (0 to 100)<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-weight:700\">Ranks above {{ scAbove }}% of {{ scOf }} scored projects<\u002Fdiv>\n          <div style=\"font-weight:600;font-size:13px\">How the {{ sc.score }} points are built<\u002Fdiv>\n          <sc-for list=\"{{ scBars }}\" as=\"b\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:70px 1fr 28px;gap:8px;align-items:center;font-size:13px\"><div>{{ b.n }}<\u002Fdiv><div style=\"height:10px;background:#EDF2F5;border-radius:5px\"><div style=\"height:10px;border-radius:5px;width:{{ b.w }};background:{{ b.c }}\"><\u002Fdiv><\u002Fdiv><div style=\"font-weight:700;text-align:right\">{{ b.pts }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <div style=\"font-size:12px;color:#666\">{{ scWeights }}. Weights set by RTC and shown to all users.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px\">\n        <div style=\"font-weight:700\">Benefit by goal area<\u002Fdiv>\n        <div style=\"font-size:12px;color:#666;margin:2px 0 10px\">Score 0 to 100, weight in parentheses. Scores do not change when other projects are added.<\u002Fdiv>\n        <sc-for list=\"{{ scGoals }}\" as=\"g\" hint-placeholder-count=\"9\"><div style=\"display:grid;grid-template-columns:minmax(0,190px) 1fr 30px;gap:8px;align-items:center;font-size:13px;padding:3px 0\"><div>{{ g.n }} ({{ g.w }})<\u002Fdiv><div style=\"height:10px;background:#EDF2F5;border-radius:5px\"><div style=\"height:10px;border-radius:5px;background:#0D5C80;width:{{ g.bw }}\"><\u002Fdiv><\u002Fdiv><div style=\"font-weight:700;text-align:right\">{{ g.sc }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px\">\n        <div style=\"font-weight:700;margin-bottom:8px\">Key facts<\u002Fdiv>\n        <sc-for list=\"{{ scFacts }}\" as=\"f\" hint-placeholder-count=\"7\"><div style=\"display:grid;grid-template-columns:130px 1fr;gap:8px;padding:6px 0;border-top:1px solid #F0F3F6;font-size:13px\"><div style=\"color:#666\">{{ f.k }}<\u002Fdiv><div style=\"font-weight:600\">{{ f.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px\">\n        <div style=\"font-weight:700;margin-bottom:8px\">Top benefit drivers (points)<\u002Fdiv>\n        <sc-for list=\"{{ scDrivers }}\" as=\"d\" hint-placeholder-count=\"5\"><div style=\"display:grid;grid-template-columns:minmax(0,170px) 1fr 30px;gap:8px;align-items:center;font-size:13px;padding:4px 0\"><div>{{ d.n }}<\u002Fdiv><div style=\"height:10px;background:#EDF2F5;border-radius:5px\"><div style=\"height:10px;border-radius:5px;background:#8E5393;width:{{ d.w }}\"><\u002Fdiv><\u002Fdiv><div style=\"font-weight:700;text-align:right\">{{ d.v }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n        <div style=\"font-size:13px;color:#444;margin-top:10px\">{{ scRead }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:16px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"display:flex;align-items:center;gap:8px\"><div style=\"font-weight:700;flex:1\">Public feedback<\u002Fdiv><sc-if value=\"{{ fbNewAny }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"background:#F3D9C9;border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700\">{{ fbNew }} unreviewed<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <div style=\"font-siz   <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-raw-select value=\"{{ qSp }}\" sc-camel-on-change=\"{{ onQSp }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ qSpOpts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n        <button sc-camel-on-click=\"{{ onQFlag }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px 10px;font-family:inherit;font-size:13px;background:#fff;cursor:pointer\">{{ qFlagLbl }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onQSort }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px 10px;font-family:inherit;font-size:13px;background:#fff;cursor:pointer\">{{ qSortLbl }}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:60px minmax(0,1fr) minmax(0,130px) 44px;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#666;font-weight:600;padding:0 8px\"><div>ID<\u002Fdiv><div>Project<\u002Fdiv><div>Sponsor<\u002Fdiv><div style=\"text-align:center\">Flags<\u002Fdiv><\u002Fdiv>\n      <sc-for list=\"{{ qRows }}\" as=\"r\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:grid;grid-template-columns:60px minmax(0,1fr) minmax(0,130px) 44px;gap:8px;align-items:center;padding:9px 8px;border-top:1px solid #F0F3F6;cursor:pointer;background:{{ r.bg }};font-size:13px\"><div style=\"color:#666\">{{ r.id }}<\u002Fdiv><div style=\"font-weight:600\">{{ r.name }}<\u002Fdiv><div style=\"color:#444\">{{ r.sp }}<\u002Fdiv><div style=\"text-align:center\"><span style=\"display:inline-block;min-width:22px;padding:2px 6px;border-radius:10px;font-weight:700;background:{{ r.nbg }}\">{{ r.n }}<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <div style=\"font-size:12px;color:#666\">Flags come from automatic checks: missing data, location problems, <\u002Fsc-raw-select><\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ qHasOwn }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"border:1px solid #DDE5EA;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-weight:700;font-size:13px\">Sponsor estimates vs RTC model<\u002Fdiv>\n          <sc-for list=\"{{ qOwnRows }}\" as=\"r\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 52px;gap:6px;align-items:center;font-size:12px;border-top:1px solid #F0F3F6;padding-top:5px\"><div><b>{{ r.cat }}<\u002Fb><div style=\"color:#666\">{{ r.kpi }}<\u002Fdiv><\u002Fdiv><div>{{ r.s }}<\u002Fdiv><div>{{ r.r }}<\u002Fdiv><div style=\"background:{{ r.bg }};border-radius:8px;padding:1px 4px;text-align:center;font-weight:600\">{{ r.gap }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n          <div style=\"font-size:11px;color:#666\">Columns: category, sponsor, RTC model, gap. Range is plus or minus 25%.<\u002Fdiv>\n          <div style=\"font-size:12px;background:#F4F7F9;border-radius:10px;padding:6px 8px\">Sponsor rationale: {{ qWhy }}<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600\">{{ qOwnNote }}<\u002Fdiv>\n          <sc-if value=\"{{ qHasAdopt }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#0D5C80;font-weight:700\">{{ qAdoptTxt }}<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-if value=\"{{ qNeedEngage }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ qEngage }}\" style=\"background:#0D5C80;color:#fff;border:0;border-radius:10px;padding:6px 10px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Engage sponsor<\u002Fbutton><\u002Fsc-if>\n            <sc-if value=\"{{ qCanAdopt }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ qAdoptRtc }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:6px 10px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Adopt RTC model<\u002Fbutton><button sc-camel-on-click=\"{{ qAdoptSp }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:6px 10px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer\">Adopt sponsor estimates<\u002Fbutton><\u002Fsc-if>\n          <\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n        <div style=\"font-weight:600;font-size:13px\">Staff actions<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ qApprove }}\" style=\"background:#0D5C80;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Approve and score<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ qReturn }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Return to sponsor<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ qMerge }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Merge into family<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ qEditToggle }}\" style=\"background:#fff;color:#0D5C80;border:1px solid #0D5C80;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer\">Edit fields<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_phasing }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n  <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Program Phasing: Group Projects by Available Funding Sources<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:re nge=\"{{ r.onFund }}\" style=\"border:1px solid #DDE5EA;border-radius:10px;padding:6px;font-family:inherit;font-size:13px;background:#fff\"><sc-for list=\"{{ r.opts }}\" as=\"o\" hint-placeholder-count=\"1\"><option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv><\u002Fsc-for>\n        <div style=\"font-weight:700;border-top:1px solid #C9D3D9;padding-top:12px\">Budget check<\u002Fdiv>\n        <sc-for list=\"{{ pSrc }}\" as=\"x\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:90px minmax(0,1fr) 120px 150px;gap:10px;align-items:center;font-size:13px\"><div style=\"font-weight:600\">{{ x.src }}<\u002Fdiv><div style=\"height:10px;background:#EDF2F5;border-radius:5px\"><div style=\"height:10px;border-radius:5px;width:{{ x.w }};background:{{ x.bar }}\"><\u002Fdiv><\u002Fdiv><div>{{ x.used }} / {{ x.cap }}<\u002Fdiv><div style=\"color:#444\">{{ x.msg }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n        <div style=\"padding:10px 12px;border-radius:10px;font-size:13px;background:{{ pAlertBg }}\">{{ pAlert }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ v_home }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n  <div style=\"font-size:26px;font-weight:800;letter-spacing:-.02em\">Sponsor Home: City of Henderson<\u002Fdiv>\n  <div style=\"background:#E1EEF3;border-radius:12px;padding:12px 16px;font-size:14px\"><b>Call for projects open:<\u002Fb> closes in 21 days. {{ hDrafts }} drafts need attention before the deadline.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:12px\">\n    <sc-for list=\"{{ hTiles }}\" as=\"t\" hint-placeholder-count=\"5\"><div style=\"background:#fff;border:1px solid #E8EDF1;border-radius:16px;box-shadow:0 1px 2px rgba(16,40,56,.04),0 8px 24px -12px rgba(16,40,56,.10);padding:14px\"><div style=\"font-size:30px;font-wei
